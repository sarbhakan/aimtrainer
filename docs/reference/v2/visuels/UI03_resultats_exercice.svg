<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>AIM/LOCAL — référence visuelle V2</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#0B1119"/><rect x="0" y="0" width="232" height="1080" rx="0" fill="#121D29"/><text x="28" y="61" font-family="DejaVu Sans" font-size="28" font-weight="600" fill="#F2F6FA" text-anchor="start">AIM/LOCAL</text><text x="28" y="90" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#A9BACB" text-anchor="start">ENTRAÎNEZ LE GESTE</text><text x="34" y="186" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#A9BACB" text-anchor="start">Entraînement</text><text x="34" y="253" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#A9BACB" text-anchor="start">Calibration</text><rect x="16" y="287" width="200" height="51" rx="9" fill="#1B2A3A"/><rect x="16" y="300" width="3" height="25" rx="1" fill="#42D9CB"/><text x="34" y="320" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#F2F6FA" text-anchor="start">Historique</text><text x="34" y="387" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#A9BACB" text-anchor="start">Réglages</text><circle cx="35" cy="1009" r="5" fill="#42D9CB"/><text x="51" y="1015" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#A9BACB" text-anchor="start">Disponible hors ligne</text><text x="28" y="1052" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#A9BACB" text-anchor="start">Windows · profil local</text><text x="272" y="70" font-family="DejaVu Sans" font-size="38" font-weight="600" fill="#F2F6FA" text-anchor="start">Acquisition · séance terminée</text><text x="272" y="114" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#A9BACB" text-anchor="start">Les trois gestes sont présentés séparément.</text><rect x="272" y="170" width="522" height="390" rx="14" fill="#121D29" stroke="#314252" stroke-width="1"/><text x="298" y="219" font-family="DejaVu Sans" font-size="27" font-weight="600" fill="#F2F6FA" text-anchor="start">Micro-correction</text><text x="298" y="255" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#A9BACB" text-anchor="start">0–20 s</text><text x="298" y="327" font-family="DejaVu Sans" font-size="62" font-weight="600" fill="#42D9CB" text-anchor="start">54</text><text x="298" y="360" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="start">cibles touchées</text><line x1="298" y1="387" x2="768" y2="387" stroke="#314252" stroke-width="1"/><text x="298" y="430" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="start">Précision</text><text x="768" y="430" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#F2F6FA" text-anchor="end">91,5 %</text><text x="298" y="487" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="start">Acquisition médiane</text><text x="768" y="487" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#F2F6FA" text-anchor="end">231 ms</text><rect x="819" y="170" width="522" height="390" rx="14" fill="#121D29" stroke="#314252" stroke-width="1"/><text x="845" y="219" font-family="DejaVu Sans" font-size="27" font-weight="600" fill="#F2F6FA" text-anchor="start">Acquisition générale</text><text x="845" y="255" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#A9BACB" text-anchor="start">20–40 s</text><text x="845" y="327" font-family="DejaVu Sans" font-size="62" font-weight="600" fill="#42D9CB" text-anchor="start">46</text><text x="845" y="360" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="start">cibles touchées</text><line x1="845" y1="387" x2="1315" y2="387" stroke="#314252" stroke-width="1"/><text x="845" y="430" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="start">Précision</text><text x="1315" y="430" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#F2F6FA" text-anchor="end">88,5 %</text><text x="845" y="487" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="start">Acquisition médiane</text><text x="1315" y="487" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#F2F6FA" text-anchor="end">299 ms</text><rect x="1366" y="170" width="522" height="390" rx="14" fill="#121D29" stroke="#314252" stroke-width="1"/><text x="1392" y="219" font-family="DejaVu Sans" font-size="27" font-weight="600" fill="#F2F6FA" text-anchor="start">Grande amplitude</text><text x="1392" y="255" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#A9BACB" text-anchor="start">40–60 s</text><text x="1392" y="327" font-family="DejaVu Sans" font-size="62" font-weight="600" fill="#42D9CB" text-anchor="start">35</text><text x="1392" y="360" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="start">cibles touchées</text><line x1="1392" y1="387" x2="1862" y2="387" stroke="#314252" stroke-width="1"/><text x="1392" y="430" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="start">Précision</text><text x="1862" y="430" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#F2F6FA" text-anchor="end">85,4 %</text><text x="1392" y="487" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="start">Acquisition médiane</text><text x="1862" y="487" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#F2F6FA" text-anchor="end">391 ms</text><rect x="272" y="597" width="1616" height="189" rx="14" fill="#121D29" stroke="#314252" stroke-width="1"/><text x="300" y="643" font-family="DejaVu Sans" font-size="25" font-weight="600" fill="#F2F6FA" text-anchor="start">Lecture de cette séance</text><text x="300" y="686" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="start">Les grandes amplitudes ont demandé davantage de temps. Travaillez la reprise de précision après le déplacement.</text><text x="300" y="729" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="start">Comparez chaque phase à vos séances dans les mêmes conditions.</text><rect x="272" y="836" width="350" height="62" rx="10" fill="#42D9CB" stroke="#42D9CB" stroke-width="1"/><text x="447.0" y="874.0" font-family="DejaVu Sans" font-size="20" font-weight="600" fill="#0B1119" text-anchor="middle">Recommencer</text><rect x="646" y="836" width="360" height="62" rx="10" fill="#1B2A3A" stroke="#314252" stroke-width="1"/><text x="826.0" y="874.0" font-family="DejaVu Sans" font-size="20" font-weight="600" fill="#F2F6FA" text-anchor="middle">Voir les essais</text><rect x="1030" y="836" width="390" height="62" rx="10" fill="#1B2A3A" stroke="#314252" stroke-width="1"/><text x="1225.0" y="874.0" font-family="DejaVu Sans" font-size="20" font-weight="600" fill="#F2F6FA" text-anchor="middle">Exporter le rapport</text><text x="272" y="978" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#FFCA74" text-anchor="start">Données fictives pour la maquette · ne pas intégrer ces nombres comme résultats par défaut.</text></svg>