<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>AIM/LOCAL — référence visuelle V2</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#0B1119"/><rect x="0" y="0" width="232" height="1080" rx="0" fill="#121D29"/><text x="28" y="61" font-family="DejaVu Sans" font-size="28" font-weight="600" fill="#F2F6FA" text-anchor="start">AIM/LOCAL</text><text x="28" y="90" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#A9BACB" text-anchor="start">ENTRAÎNEZ LE GESTE</text><text x="34" y="186" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#A9BACB" text-anchor="start">Entraînement</text><rect x="16" y="220" width="200" height="51" rx="9" fill="#1B2A3A"/><rect x="16" y="233" width="3" height="25" rx="1" fill="#42D9CB"/><text x="34" y="253" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#F2F6FA" text-anchor="start">Calibration</text><text x="34" y="320" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#A9BACB" text-anchor="start">Historique</text><text x="34" y="387" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#A9BACB" text-anchor="start">Réglages</text><circle cx="35" cy="1009" r="5" fill="#42D9CB"/><text x="51" y="1015" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#A9BACB" text-anchor="start">Disponible hors ligne</text><text x="28" y="1052" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#A9BACB" text-anchor="start">Windows · profil local</text><text x="272" y="69" font-family="DejaVu Sans" font-size="38" font-weight="600" fill="#F2F6FA" text-anchor="start">Trouver un réglage qui vous convient</text><text x="272" y="112" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#A9BACB" text-anchor="start">Un réglage constant pendant chaque bloc. Une confirmation sur deux jours.</text><rect x="272" y="153" width="1616" height="104" rx="12" fill="#121D29" stroke="#314252" stroke-width="1"/><text x="298" y="195" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="start">Votre point de départ</text><text x="298" y="234" font-family="DejaVu Sans" font-size="27" font-weight="600" fill="#F2F6FA" text-anchor="start">35,0 cm/360    ·    800 DPI    ·    Profil général</text><rect x="1560" y="182" width="298" height="48" rx="10" fill="#1B2A3A" stroke="#314252" stroke-width="1"/><text x="1709.0" y="213.0" font-family="DejaVu Sans" font-size="20" font-weight="600" fill="#F2F6FA" text-anchor="middle">Vérifier le réglage</text><rect x="272" y="298" width="522" height="354" rx="14" fill="#121D29" stroke="#314252" stroke-width="1"/><text x="299" y="339" font-family="DejaVu Sans" font-size="17" font-weight="600" fill="#42D9CB" text-anchor="start">01</text><text x="299" y="389" font-family="DejaVu Sans" font-size="26" font-weight="600" fill="#F2F6FA" text-anchor="start">Exploration</text><text x="299" y="441" font-family="DejaVu Sans" font-size="36" font-weight="600" fill="#42D9CB" text-anchor="start">11 min 36 s</text><text x="299" y="502" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#A9BACB" text-anchor="start">Comparer trois réglages</text><text x="299" y="548" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#A9BACB" text-anchor="start">28,0 · 35,0 · 43,75 cm/360</text><text x="299" y="607" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#A9BACB" text-anchor="start">4 gestes : clic, fluide, réactif, transitions</text><rect x="819" y="298" width="522" height="354" rx="14" fill="#121D29" stroke="#314252" stroke-width="1"/><text x="846" y="339" font-family="DejaVu Sans" font-size="17" font-weight="600" fill="#42D9CB" text-anchor="start">02</text><text x="846" y="389" font-family="DejaVu Sans" font-size="26" font-weight="600" fill="#F2F6FA" text-anchor="start">Confirmation · jour 1</text><text x="846" y="441" font-family="DejaVu Sans" font-size="36" font-weight="600" fill="#42D9CB" text-anchor="start">16 min 48 s</text><text x="846" y="502" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#A9BACB" text-anchor="start">Comparer votre réglage et le candidat</text><text x="846" y="548" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#A9BACB" text-anchor="start">Quatre blocs avec des pauses</text><text x="846" y="607" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#A9BACB" text-anchor="start">4 gestes : clic, fluide, réactif, transitions</text><rect x="1366" y="298" width="522" height="354" rx="14" fill="#121D29" stroke="#314252" stroke-width="1"/><text x="1393" y="339" font-family="DejaVu Sans" font-size="17" font-weight="600" fill="#42D9CB" text-anchor="start">03</text><text x="1393" y="389" font-family="DejaVu Sans" font-size="26" font-weight="600" fill="#F2F6FA" text-anchor="start">Confirmation · jour 2</text><text x="1393" y="441" font-family="DejaVu Sans" font-size="36" font-weight="600" fill="#42D9CB" text-anchor="start">16 min 48 s</text><text x="1393" y="502" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#A9BACB" text-anchor="start">Reprendre la comparaison un autre jour</text><text x="1393" y="548" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#A9BACB" text-anchor="start">Ordre inversé et nouveaux parcours</text><text x="1393" y="607" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#A9BACB" text-anchor="start">4 gestes : clic, fluide, réactif, transitions</text><rect x="272" y="690" width="1616" height="138" rx="12" fill="#121D29" stroke="#314252" stroke-width="1"/><text x="298" y="732" font-family="DejaVu Sans" font-size="23" font-weight="600" fill="#F2F6FA" text-anchor="start">Ce que vous obtenez</text><text x="298" y="772" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="start">Un candidat, puis un résultat par geste et par jour. Si les résultats sont trop proches ou divergents,</text><text x="298" y="806" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="start">l’application vous le dira et conservera votre réglage comme choix par défaut.</text><rect x="272" y="869" width="520" height="66" rx="10" fill="#42D9CB" stroke="#42D9CB" stroke-width="1"/><text x="532.0" y="909.0" font-family="DejaVu Sans" font-size="20" font-weight="600" fill="#0B1119" text-anchor="middle">Commencer l’exploration</text><rect x="820" y="869" width="370" height="66" rx="10" fill="#1B2A3A" stroke="#314252" stroke-width="1"/><text x="1005.0" y="909.0" font-family="DejaVu Sans" font-size="20" font-weight="600" fill="#F2F6FA" text-anchor="middle">Reprendre un protocole</text><text x="272" y="1006" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#A9BACB" text-anchor="start">Prévoyez de la place pour déplacer la souris. Vous pouvez arrêter et conserver une séance incomplète.</text></svg>