t-family="DejaVu Sans" font-size="21" font-weight="600" fill="#F2F6FA" text-anchor="middle">4 m</text><text x="416" y="1074" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="middle">2,6°</text><circle cx="640" cy="932" r="38.39644095190513" fill="#42D9CB"/><text x="640" y="1036" font-family="DejaVu Sans" font-size="21" font-weight="600" fill="#F2F6FA" text-anchor="middle">5 m</text><text x="640" y="1074" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="middle">2,08°</text><text x="78" y="1141" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#A9BACB" text-anchor="start">À gauche la cible est plus proche, elle paraît plus grande.</text><text x="78" y="1177" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#A9BACB" text-anchor="start">Aucun rétrécissement commandé par l’âge ou les dégâts.</text><text x="838" y="737" font-family="DejaVu Sans" font-size="26" font-weight="600" fill="#F2F6FA" text-anchor="start">04 · Une nouvelle identité après destruction</text><text x="838" y="778" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#A9BACB" text-anchor="start">EX02 · un seul slot remplacé ; ses voisines restent en place</text><circle cx="929" cy="929" r="26" fill="#42D9CB"/><circle cx="1203" cy="883" r="26" fill="#42D9CB"/><circle cx="1081" cy="977" r="26" fill="none" stroke="#A9BACB" stroke-width="2"/><line x1="1061" y1="957" x2="1101" y2="997" stroke="#A9BACB" stroke-width="2"/><line x1="1061" y1="997" x2="1101" y2="957" stroke="#A9BACB" stroke-width="2"/><line x1="1115" y1="967" x2="1369" y2="901" stroke="#FFB454" stroke-width="2"/><circle cx="1405" cy="893" r="26" fill="#42D9CB"/><text x="1058" y="1040" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#A9BACB" text-anchor="start">ancienne</text><text x="1362" y="949" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#FFB454" text-anchor="start">nouvelle</text><text x="838" y="1101" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#A9BACB" text-anchor="start">Tirages indépendants du viseur, séparation avec les vivantes.</text><text x="838" y="1141" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#A9BACB" text-anchor="start">La nouvelle génération doit être rendue avant de recevoir</text><text x="838" y="1177" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#A9BACB" text-anchor="start">un impact. L’effet de disparition n’a aucune collision.</text><text x="48" y="1250" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#A9BACB" text-anchor="start">Règle commune : la silhouette active et la sphère du hitscan ont exactement le même centre et le même rayon.</text></svg>