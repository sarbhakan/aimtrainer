<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>AIM/LOCAL — référence visuelle V2</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#0B1119"/><rect x="0" y="0" width="232" height="1080" rx="0" fill="#121D29"/><text x="28" y="61" font-family="DejaVu Sans" font-size="28" font-weight="600" fill="#F2F6FA" text-anchor="start">AIM/LOCAL</text><text x="28" y="90" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#A9BACB" text-anchor="start">ENTRAÎNEZ LE GESTE</text><text x="34" y="186" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#A9BACB" text-anchor="start">Entraînement</text><rect x="16" y="220" width="200" height="51" rx="9" fill="#1B2A3A"/><rect x="16" y="233" width="3" height="25" rx="1" fill="#42D9CB"/><text x="34" y="253" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#F2F6FA" text-anchor="start">Calibration</text><text x="34" y="320" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#A9BACB" text-anchor="start">Historique</text><text x="34" y="387" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#A9BACB" text-anchor="start">Réglages</text><circle cx="35" cy="1009" r="5" fill="#42D9CB"/><text x="51" y="1015" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#A9BACB" text-anchor="start">Disponible hors ligne</text><text x="28" y="1052" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#A9BACB" text-anchor="start">Windows · profil local</text><text x="272" y="70" font-family="DejaVu Sans" font-size="38" font-weight="600" fill="#F2F6FA" text-anchor="start">Un avantage retrouvé sur deux séances</text><text x="272" y="114" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#A9BACB" text-anchor="start">Résultat conditionnel à votre profil général et aux exercices testés.</text><rect x="272" y="158" width="620" height="302" rx="14" fill="#121D29" stroke="#314252" stroke-width="1"/><text x="302" y="204" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#A9BACB" text-anchor="start">Candidat recommandé</text><text x="302" y="282" font-family="DejaVu Sans" font-size="62" font-weight="600" fill="#42D9CB" text-anchor="start">28,00</text><text x="518" y="279" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#A9BACB" text-anchor="start">cm/360</text><text x="302" y="334" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#A9BACB" text-anchor="start">Réglage actuel : 35,0 cm/360</text><text x="302" y="384" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#A9BACB" text-anchor="start">Déplacement plus court pour une même rotation.</text><text x="302" y="423" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#A9BACB" text-anchor="start">800 DPI · gain : 0,0408214° par unité relative</text><rect x="922" y="158" width="966" height="302" rx="14" fill="#121D29" stroke="#314252" stroke-width="1"/><text x="952" y="204" font-family="DejaVu Sans" font-size="23" font-weight="600" fill="#F2F6FA" text-anchor="start">Différence de l’indice composite · points</text><text x="952" y="260" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#A9BACB" text-anchor="start">Jour 1</text><rect x="1086" y="237" width="590" height="26" rx="6" fill="#1B2A3A"/><rect x="1086" y="237" width="362.85" height="26" rx="6" fill="#42D9CB"/><text x="1828" y="260" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#F2F6FA" text-anchor="end">+3,08 pt</text><text x="952" y="336" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#A9BACB" text-anchor="start">Jour 2</text><rect x="1086" y="313" width="590" height="26" rx="6" fill="#1B2A3A"/><rect x="1086" y="313" width="377.6" height="26" rx="6" fill="#42D9CB"/><text x="1828" y="336" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#F2F6FA" text-anchor="end">+3,20 pt</text><text x="952" y="386" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#A9BACB" text-anchor="start">Échelle : 0 à 5 points</text><text x="952" y="425" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#A9BACB" text-anchor="start">Avantage observé après la courte prise en main prévue.</text><rect x="272" y="497" width="1616" height="260" rx="14" fill="#121D29" stroke="#314252" stroke-width="1"/><text x="300" y="541" font-family="DejaVu Sans" font-size="25" font-weight="600" fill="#F2F6FA" text-anchor="start">Vérification par geste</text><text x="300" y="592" font-family="DejaVu Sans" font-size="22" font-weight="600" fill="#F2F6FA" text-anchor="start">Clic</text><text x="300" y="635" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#42D9CB" text-anchor="start">Jour 1   +2,9 pt</text><text x="300" y="674" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#42D9CB" text-anchor="start">Jour 2   +2,9 pt</text><text x="692" y="592" font-family="DejaVu Sans" font-size="22" font-weight="600" fill="#F2F6FA" text-anchor="start">Suivi fluide</text><text x="692" y="635" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#42D9CB" text-anchor="start">Jour 1   +2,7 pt</text><text x="692" y="674" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#42D9CB" text-anchor="start">Jour 2   +2,9 pt</text><text x="1084" y="592" font-family="DejaVu Sans" font-size="22" font-weight="600" fill="#F2F6FA" text-anchor="start">Suivi réactif</text><text x="1084" y="635" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#42D9CB" text-anchor="start">Jour 1   +4,6 pt</text><text x="1084" y="674" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#42D9CB" text-anchor="start">Jour 2   +4,9 pt</text><text x="1476" y="592" font-family="DejaVu Sans" font-size="22" font-weight="600" fill="#F2F6FA" text-anchor="start">Transitions</text><text x="1476" y="635" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#42D9CB" text-anchor="start">Jour 1   +2,1 pt</text><text x="1476" y="674" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#42D9CB" text-anchor="start">Jour 2   +2,1 pt</text><text x="300" y="727" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#A9BACB" text-anchor="start">Pour chaque réglage : 60/64 réussites au clic et 44/48 cibles terminées en transfert.</text><rect x="272" y="800" width="458" height="64" rx="10" fill="#42D9CB" stroke="#42D9CB" stroke-width="1"/><text x="501.0" y="839.0" font-family="DejaVu Sans" font-size="20" font-weight="600" fill="#0B1119" text-anchor="middle">Appliquer ce candidat</text><rect x="754" y="800" width="458" height="64" rx="10" fill="#1B2A3A" stroke="#314252" stroke-width="1"/><text x="983.0" y="839.0" font-family="DejaVu Sans" font-size="20" font-weight="600" fill="#F2F6FA" text-anchor="middle">Conserver mon réglage</text><rect x="1236" y="800" width="390" height="64" rx="10" fill="#1B2A3A" stroke="#314252" stroke-width="1"/><text x="1431.0" y="839.0" font-family="DejaVu Sans" font-size="20" font-weight="600" fill="#F2F6FA" text-anchor="middle">Exporter les données</text><text x="272" y="930" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#A9BACB" text-anchor="start">Essayez ensuite ce réglage dans votre jeu habituel. Vous pourrez revenir à votre réglage précédent.</text><text x="272" y="998" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#FFCA74" text-anchor="start">Données fictives pour la maquette · le texte réel dépend exclusivement du moteur de décision.</text></svg>